name: NS Magnet News checks

on:
  push:
    branches:
      - feature/ns-magnet-news
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # This repository already contains hundreds of unrelated JS type errors.
      # Surface diagnostics without preventing the production bundle check.
      - run: npm run check
        continue-on-error: true
      - run: npm run build
